# Refresh data and the forecast several times a day. Committing the new data to
# main makes Vercel redeploy the site automatically.
#
# GitHub starts scheduled runs late (sometimes hours) and sometimes skips them,
# so there are six slots a day at off-peak minutes instead of three on the hour.
# A run that overlaps another waits (concurrency), and watchdog.yml opens an issue
# if the published data ever goes stale anyway.
name: forecast
on:
  schedule:
    - cron: "37 6 * * *"          # 2:37am ET: also rebuilds the odds-over-time history
    - cron: "17 11,17,23 * * *"   # 7:17am, 1:17pm, 7:17pm ET (EDT)
    - cron: "37 14,20 * * *"      # 10:37am, 4:37pm ET (EDT)
  workflow_dispatch:
    inputs:
      history:
        description: "Also rebuild the odds-over-time history (about 5 more minutes)"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: forecast
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - name: Tests
        run: cd pipeline && python -m pytest -q
      - name: Run forecast
        env:
          BELLWETHER_USER_AGENT: ${{ vars.BELLWETHER_USER_AGENT }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          # manual runs: the checkbox; the 2:37am ET schedule: always
          HISTORY: ${{ (inputs.history || github.event.schedule == '37 6 * * *') && '--history' || '' }}
        run: cd pipeline && python -m bellwether.run --sims 40000 $HISTORY
      - name: Commit snapshot
        run: |
          git config user.name "bellwether-bot"
          git config user.email "bellwether-bot@users.noreply.github.com"
          git add web/public data/cache
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Forecast update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Open an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Forecast update failed"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" \
              --body "The scheduled forecast run failed, so the site may be showing older data. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
