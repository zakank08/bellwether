# Refresh data and the forecast three times a day. Committing the new data to
# main makes Vercel redeploy the site automatically.
name: forecast
on:
  schedule:
    - cron: "15 11,17,23 * * *"   # 7:15am, 1:15pm, 7:15pm ET (EDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forecast
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r pipeline/requirements.txt
      - name: Tests
        run: cd pipeline && python -m pytest -q
      - name: Run forecast
        env:
          BELLWETHER_USER_AGENT: ${{ vars.BELLWETHER_USER_AGENT }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: cd pipeline && python -m bellwether.run --sims 40000
      - name: Commit snapshot
        run: |
          git config user.name "bellwether-bot"
          git config user.email "bellwether-bot@users.noreply.github.com"
          git add web/public data/cache
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Forecast update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main
