# Refresh data and the forecast three times a day, then redeploy the static site.
name: forecast
on:
  schedule:
    - cron: "15 11,17,23 * * *"   # 7:15am, 1:15pm, 7:15pm ET (EDT)
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Fetch 538 historical polls (pollster ratings, backtest)
        run: curl -sSfL https://raw.githubusercontent.com/fivethirtyeight/data/master/pollster-ratings/raw_polls.csv -o data/history/raw_polls.csv
      - run: pip install -r pipeline/requirements.txt
      - run: cd pipeline && python -m pytest -q
      - name: Run forecast
        env:
          BELLWETHER_USER_AGENT: ${{ vars.BELLWETHER_USER_AGENT }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: cd pipeline && python -m bellwether.run --sims 40000
      - name: Commit snapshot
        run: |
          git config user.name "bellwether-bot"; git config user.email "bot@users.noreply.github.com"
          git add web/public/data data/cache && git commit -m "Forecast update $(date -u +%FT%TZ)" || echo "no changes"
          git push
      - name: Trigger deploy
        if: ${{ secrets.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -sS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
