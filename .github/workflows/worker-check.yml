name: worker-check
# A read-only dry run of the election-night readers from GitHub's own servers: runs the tests, reads every configured state once,
# and prints what each state's site returned. Nothing is published. Runs when the reader code or the state list changes, or by hand.
on:
  push:
    branches: [main]
    paths:
      - "pipeline/bellwether/results/**"
      - "pipeline/bellwether/http.py"
      - "data/config/live_sources.json"
      - "data/config/extra_ca.pem"
      - ".github/workflows/worker-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest
      - name: Tests
        working-directory: pipeline
        run: python -m pytest -q tests/test_results.py
      - name: Read every configured state once
        working-directory: pipeline
        env:
          BELLWETHER_USER_AGENT: ${{ vars.BELLWETHER_USER_AGENT }}
        run: python -m bellwether.results.run --once --out /tmp/live
      - name: Summary of what was read
        run: |
          python - <<'PY'
          import json
          r = json.load(open('/tmp/live/results.json')); s = json.load(open('/tmp/live/status.json'))
          print('races read:', len(r['races']))
          for st, v in s['states'].items():
              print(st, v['state'], v.get('races', ''), v.get('message', ''))
          PY
