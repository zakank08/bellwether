name: election-night
# Runs the results worker for election night (Nov. 3-4).
# Starts by itself at 15:00 UTC (10 a.m. Central, 11 a.m. Eastern) on Nov. 3, and can also be started by hand:
# Actions -> election-night -> Run workflow. (GitHub sometimes starts scheduled jobs late, so the job is chained and long.)
# One job lasts at most 6 hours, so four are chained at 5.4 hours each: about 21 hours, from late morning Nov. 3 to about 8 a.m. ET Nov. 4,
# long enough for Alaska, the mail-heavy western counts and the slow tails.
# Publishing: into Cloudflare R2 when its four secrets exist (updates every ~15 s); otherwise the worker commits the live files into the site
# (web/public/data/live) every 10-30 minutes. See docs/live-storage-setup.md.
on:
  schedule:
    - cron: "0 15 3 11 *"
  workflow_dispatch:
    inputs:
      rehearsal:
        description: "TEST RUN: publishes a clearly labeled rehearsal (old data) to /election-night/?rehearsal=1 only. The public board is not touched."
        type: boolean
        default: false
      hours:
        description: "Length of each part in hours (leave 5.4; use 0.05 for a 3-minute test that runs only one part)"
        type: string
        default: "5.4"

permissions:
  contents: read

concurrency:
  # a test run must never wait behind (or cancel) the real election-night run, so it gets its own group
  group: ${{ inputs.rehearsal && 'election-night-test' || 'election-night' }}
  cancel-in-progress: false

jobs:
  part1:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt boto3
      - name: Worker
        working-directory: pipeline
        env:
          BELLWETHER_USER_AGENT: ${{ vars.BELLWETHER_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ "${{ inputs.rehearsal }}" = "true" ]; then
            python -m bellwether.results.run --rehearse --upload --out live
          else
            python -m bellwether.results.run --loop --upload --hours ${{ inputs.hours || 5.4 }} --out live
          fi
  part2:
    needs: part1
    if: ${{ !cancelled() && inputs.rehearsal != true && (inputs.hours == '' || inputs.hours == '5.4') }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt boto3
      - name: Worker
        working-directory: pipeline
        env:
          BELLWETHER_USER_AGENT: ${{ vars.BELLWETHER_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m bellwether.results.run --loop --upload --hours ${{ inputs.hours || 5.4 }} --out live
  part3:
    needs: part2
    if: ${{ !cancelled() && inputs.rehearsal != true && (inputs.hours == '' || inputs.hours == '5.4') }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt boto3
      - name: Worker
        working-directory: pipeline
        env:
          BELLWETHER_USER_AGENT: ${{ vars.BELLWETHER_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m bellwether.results.run --loop --upload --hours ${{ inputs.hours || 5.4 }} --out live
  part4:
    needs: part3
    if: ${{ !cancelled() && inputs.rehearsal != true && (inputs.hours == '' || inputs.hours == '5.4') }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt boto3
      - name: Worker
        working-directory: pipeline
        env:
          BELLWETHER_USER_AGENT: ${{ vars.BELLWETHER_USER_AGENT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m bellwether.results.run --loop --upload --hours ${{ inputs.hours || 5.4 }} --out live
